name: Deploy to Hostinger

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GADS_ID: ${{ secrets.VITE_GADS_ID }}

      - name: Create PHP env file
        env:
          RESEND_API: ${{ secrets.RESEND_API }}
        run: printf 'RESEND_API=%s\n' "$RESEND_API" > dist/.env

      - name: Deploy via SSH/rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 -H 82.25.67.92 >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./dist/ \
            u537894463@82.25.67.92:/home/u537894463/domains/avapex.com.br/public_html/
